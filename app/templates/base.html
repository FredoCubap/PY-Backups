<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}PY-Backups{% endblock %}</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
      label, input, button { display: block; width: 100%; box-sizing: border-box; }
      input { padding: .5rem; margin: .25rem 0 1rem; }
      button { padding: .6rem; cursor: pointer; }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
